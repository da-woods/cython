name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref_type }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  GCC_VERSION: 10
  USE_CCACHE: 1
  CCACHE_SLOPPINESS: "pch_defines,time_macros"
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 5
  # Size guide: 10GB maximum cache storage / total number of CI jobs creating a cache.
  # However, a single run currently generates 170-210 MB, so less would use less but be useless.
  CCACHE_MAXSIZE: "220M"


jobs:
  file-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}
    permissions:
      pull-requests: read
    outputs:
      ci-changes: ${{
          github.ref_type == 'tag' ||
          steps.filter.outputs.positive-files == 'true' ||
          (steps.filter.outputs.any-files == 'true' &&
            (steps.filter.outputs.negative-files_count < steps.filter.outputs.any-files_count))
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      # Only needed to compare the "base" on push; not needed for PR
      if: ${{ github.event_name == 'push' }}
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
      id: filter
      with:
        base: ${{ github.ref }}
        filters: |
          any-files:
          - '**'
          negative-files:
          - 'Demos/benchmarks/**'
          - '.github/**'
          - '**/*.md'
          - '**/*.rst'
          - 'docs/**'
          positive-files:
          - '.github/workflows/ci*.yml'
          - 'docs/examples/**'

  ci-arm64:
    # ARM builds
    needs: [file-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.file-changes.outputs.ci-changes == 'true' || github.ref_type == 'tag' }}

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false
      matrix:
        os: [windows-11-arm]
        backend: [c]
        python-version:
          - "3.x"  # latest

    uses: ./.github/workflows/ci-job.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      backend: ${{ matrix.backend }}

  ci-success:
    needs: [ci-arm64]
    if: ${{ always() && !contains(needs.*.result, 'cancelled') }}
    env:
      FAIL: ${{ case(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'), 1, 0) }}
    runs-on: ubuntu-latest
    steps:
      - run: exit $FAIL


  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2


  codestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHON_VERSION: "3.13"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run codestyle
        run: |
          bash -c "\
            python -m pip install --no-cache-dir -U pip || exit 1 ; \
            python -m pip install --no-cache-dir -r test-requirements.txt || exit 1 ; \
            python runcodestyle.py \
              2> >(tee >(egrep '.+:[0-9]+: ' | sed -e 's/^/    /' >> $GITHUB_STEP_SUMMARY) >&2) \
            "

  build_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHON_VERSION: "3.13"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build HTML docs
        run: |
          python -m pip install --no-cache-dir -r doc-requirements.txt
          make -C docs html

      - name: Upload HTML docs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: htmldocs
          path: docs/build/html
          if-no-files-found: ignore
