name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref_type }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

env:
  MACOSX_DEPLOYMENT_TARGET: "11.0"
  GCC_VERSION: 10
  USE_CCACHE: 1
  CCACHE_SLOPPINESS: "pch_defines,time_macros"
  CCACHE_COMPRESS: 1
  CCACHE_COMPRESSLEVEL: 5
  # Size guide: 10GB maximum cache storage / total number of CI jobs creating a cache.
  # However, a single run currently generates 170-210 MB, so less would use less but be useless.
  CCACHE_MAXSIZE: "220M"


jobs:
  file-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' && github.ref_type != 'tag' }}
    permissions:
      pull-requests: read
    outputs:
      ci-changes: ${{
          github.ref_type == 'tag' ||
          steps.filter.outputs.positive-files == 'true' ||
          (steps.filter.outputs.any-files == 'true' &&
            (steps.filter.outputs.negative-files_count < steps.filter.outputs.any-files_count))
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
      # Only needed to compare the "base" on push; not needed for PR
      if: ${{ github.event_name == 'push' }}
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: filter
      with:
        base: ${{ github.ref }}
        filters: |
          any-files:
          - '**'
          negative-files:
          - 'Demos/benchmarks/**'
          - '.github/**'
          - '**/*.md'
          - '**/*.rst'
          - 'docs/**'
          positive-files:
          - '.github/workflows/ci*.yml'
          - 'docs/examples/**'


  ci-noncpython:
    # PyPy, GraalPython, ...
    #needs: [ci-early-success, file-changes]
    if: ${{ github.event_name == 'workflow_dispatch' || needs.file-changes.outputs.ci-changes == 'true' || github.ref_type == 'tag' }}

    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false
      matrix:
        python-version:
          #- pypy-3.9
          #- pypy-3.10
          #- pypy-3.11
          - graalpy25.0  # 3.12
          - graalpy25.3  # 3.13
        os: [ubuntu-24.04]
        backend: [c]

    uses: ./.github/workflows/ci-job.yml
    with:
      os: ${{ matrix.os }}
      python-version: ${{ matrix.python-version }}
      backend: ${{ matrix.backend }}
      no_cython_compile: "1"


  ci-success:
    # ci-arm64 excluded from ci-success due to https://developercommunity.microsoft.com/t/MSVC-ARM64-linkexe-hangs-building-Cytho/11167595
    # on Windows. Re-add when that's fixed.
    needs: [ci-noncpython]
    if: ${{ !cancelled() }}
    env:
      FAIL: ${{ case(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'), 1, 0) }}
    runs-on: ubuntu-latest
    steps:
      - run: exit $FAIL


  codespell:
    name: Check for spelling errors
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Codespell
        uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2


  codestyle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHON_VERSION: "3.13"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run codestyle
        run: |
          bash -c "\
            python -m pip install --no-cache-dir -U pip || exit 1 ; \
            python -m pip install --no-cache-dir -r test-requirements.txt || exit 1 ; \
            python runcodestyle.py \
              2> >(tee >(egrep '.+:[0-9]+: ' | sed -e 's/^/    /' >> $GITHUB_STEP_SUMMARY) >&2) \
            "

  build_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHON_VERSION: "3.13"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build HTML docs
        run: |
          python -m pip install --no-cache-dir -r doc-requirements.txt
          make -C docs html

      - name: Upload HTML docs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: htmldocs
          path: docs/build/html
          if-no-files-found: ignore
